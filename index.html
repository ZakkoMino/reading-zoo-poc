<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Čtecí ZOO — učíme se číst</title>
  <meta name="description" content="Aplikace pro děti na učení čtení v češtině s odměnami do ZOO.">
  <meta name="theme-color" content="#FF8E3C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
</head>
<body>
  <header class="app-header">
    <button class="brand" type="button" data-nav="onboarding" aria-label="Domů">
      <span class="brand-mark" aria-hidden="true">🐾</span>
      <span class="brand-text">Čtecí ZOO</span>
    </button>
    <nav class="topnav" aria-label="Hlavní navigace">
      <button class="navbtn" type="button" data-nav="onboarding">Domů</button>
      <button class="navbtn" type="button" data-nav="zoo">Moje ZOO</button>
      <button class="navbtn" type="button" data-nav="progress">Pro rodiče</button>
    </nav>
  </header>

  <main id="screen" class="app-main" aria-live="polite"></main>

  <footer class="app-footer">
    Prototyp · ilustrace: <a href="https://github.com/microsoft/fluentui-emoji" rel="noopener">Microsoft Fluent Emoji</a> (MIT) · pokrok se ukládá pouze v prohlížeči
    <span id="data-status" class="data-status" aria-live="polite">Data: načítání…</span>
  </footer>

  <!-- Order matters: data → state → speech → lessons → tasks → views → app -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script>
    // PWA: service worker needs a secure origin; file:// double-click mode
    // simply skips it and the app keeps working as before.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('Service worker se nepodařilo zaregistrovat.', err);
      });
    }
  </script>
</body>
</html>
